name: Select fastest working VPN servers

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main, feature/local-auto-selection]
    paths:
      - 'scanner.py'
      - 'scanner_unique.py'
      - 'server_identity.py'
      - 'candidate_pool.py'
      - 'mobile_candidates.py'
      - 'decorate_subscription.py'
      - 'healthcheck.py'
      - 'tests/**'
      - 'sources.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: fastest-vpn-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Benchmark GitHub runner network
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Direct runner -> Cloudflare (25 MB) ==="
          curl -L --silent --show-error --fail \
            --max-time 30 -o /dev/null \
            -w 'TTFB=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download} B/s\n' \
            'https://speed.cloudflare.com/__down?bytes=25000000'

      - name: Install xray-core
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | python -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          sudo install -m 0755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Collect unique logical servers and speed-test
        env:
          PYTHONUNBUFFERED: '1'
          TOP_N: '160'
          SOURCE_LIMIT: '700'
          FETCH_WORKERS: '12'
          FETCH_TIMEOUT: '10'
          TCP_TIMEOUT: '1.2'
          CONCURRENCY: '400'
          XRAY_BATCH: '32'
          TARGET_NORMAL: '100'
          TARGET_WHITELIST: '40'
          MAX_XRAY_PER_POOL: '1200'
          AVAIL_TIMEOUT: '6'
          AVAIL_TEST_URL: 'https://speed.cloudflare.com/__down?bytes=300000'
          SPEED_TIMEOUT: '12'
          ROTATION_SECONDS: '300'
          SPEED_TEST_URL: 'https://speed.cloudflare.com/__down?bytes=3000000'
        run: python -u scanner_unique.py

      - name: Collect mobile-network whitelist candidates
        env:
          MOBILE_WHITELIST_LIMIT: '40'
          SOURCE_LIMIT: '700'
        run: python -u mobile_candidates.py

      - name: Add country flags and build subscriptions
        env:
          FAST_BADGE_COUNT: '5'
          WHITELIST_LIMIT: '40'
          HAPP_TOTAL_LIMIT: '100'
        run: python -u decorate_subscription.py

      - name: Monitor subscription health
        run: python -u healthcheck.py

      - name: Commit only when subscriptions changed
        shell: bash
        run: |
          git config user.name "romlik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet -- out/normal.txt out/whitelist.txt out/happ.txt out/happ-normal.txt out/happ-whitelist.txt out/happ-mobile.txt out/mobile-whitelist.json out/mobile-whitelist-status.json out/health.json out/real-servers.json; then
            echo "Subscriptions did not change"
            git reset
            git restore out/ 2>/dev/null || true
            exit 0
          fi
          git commit -m "Update fastest working VPN servers [skip ci]"
          git push
