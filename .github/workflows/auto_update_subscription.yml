name: Auto Update HApp Subscription (Full Pool xray Probe)

on:
  schedule:
    # Каждые 5 минут: перепроверяем ВЕСЬ пул конфигов реальным xray-коннектом,
    # заменяем мёртвые/медленные лучшими по пингу. Без ограничения в 50 серверов.
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Ручной запуск в один клик через вкладку Actions

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    # // Не запускать следующий прогон, пока текущий не закончил
    concurrency:
      group: subscription-watch
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Goida VPN Configs Mirror
        run: |
          git clone --depth 1 https://github.com/AvenCores/goida-vpn-configs.git configs_repo

      - name: Download xray-core (real VLESS+Reality probe)
        run: |
          XRAY_TAG=$(curl -sL "https://api.github.com/repos/XTLS/Xray-core/releases/latest" | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "Latest xray-core: $XRAY_TAG"
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_TAG}/Xray-linux-64.zip"
          unzip -o xray.zip -d xray_tmp
          sudo mv xray_tmp/xray /usr/local/bin/xray
          chmod +x /usr/local/bin/xray
          rm -rf xray_tmp xray.zip
          xray version

      - name: Run Watch Cycle (full pool xray probe, best N by real ping)
        run: |
          python happ_top50_hub.py --watch-once --max-nodes 0 --xray-bin /usr/local/bin/xray

      - name: Commit and Push Updated Subscription
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Codex Archive Bot"
          git add happ_subscription.txt happ_subscription_b64.txt happ_subscription.json
          git commit -m "⚡ Watch: tested subscription, replaced dead servers [skip ci]" || echo "No changes to commit"
          git push
